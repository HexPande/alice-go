name: CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Cache analysis tools
        id: tools
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/golangci-lint
            ~/go/bin/govulncheck
          key: tools-${{ runner.os }}-${{ runner.arch }}-go1.27.1-lint2.14.0-vuln1.8.0
      - name: Install analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test -race -shuffle=on ./...
      - name: Check installer
        run: |
          sh -n install.sh
          bash -n scripts/package.sh scripts/install_test.sh
          shellcheck install.sh scripts/package.sh scripts/install_test.sh
          bash scripts/install_test.sh
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: golangci-lint run ./...
      - name: Check vulnerabilities
        run: govulncheck ./...

  build:
    name: Package Linux binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          # Keep cross-compilation outputs separate from the race-test cache.
          cache-dependency-path: |
            go.sum
            scripts/package.sh
      - name: Cross-compile and package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: raspberry-pi
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: raspberry-pi
          path: dist
      - name: Verify archives
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.tar.gz dist/SHA256SUMS
